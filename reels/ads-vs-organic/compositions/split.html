      tl.fromTo(".lab", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out", stagger: 0.1 }, 2.75);

      // «إن المريض بيشوفك باستمرار»: a post a day, same face each time

      // timed on the raw recording; tools/cut.py shortened its pauses, so each tween moves onto the cut (assets/voice/cut-map.json)
