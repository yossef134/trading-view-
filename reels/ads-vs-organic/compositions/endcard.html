  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#end-cta", "#end-follow", "#end-done", "#end-name", "#end-sub"], { opacity: 0 });
      gsap.set("#end-field", { clipPath: "inset(0px 0px 0px 0px round 0px)" });

      [0.13, 1.12].forEach((t, i) => {
        tl.fromTo(`#end-cta .w:nth-child(${i + 1})`, { color: "#C5CBD6" }, { color: "#13213F", duration: 0.1, ease: "none" }, t);

      // the button is pressed and flips to followed
      tl.to("#end-follow", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, 1.6);

      // «أنا يوسف»: the name wipes in right to left
      tl.set("#end-name", { opacity: 1 }, 2.25);
      tl.fromTo("#end-name", { clipPath: "inset(0px 0px 0px 100%)" }, { clipPath: "inset(0px 0px 0px 0%)", duration: 0.5, ease: "power3.out" }, 2.25);
      // «وبساعد الدكاترة يعملوا محتوى يبيع ويبني ثقة مع المريض»: each word turns ink as it is spoken
      tl.set("#end-sub", { opacity: 1 }, 3.1);
      [3.26, 3.74, 4.3, 4.6, 5.0, 5.6, 5.92, 6.24, 6.34].forEach((t, i) => {

      });
      window.__timelines["endcard"] = tl;
    })();
