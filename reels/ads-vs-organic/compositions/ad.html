  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // initial state: only the badge, exactly where the hook left it
      gsap.set("#ad-badge", { scale: 0.25 });
      gsap.set(["#ad-shell", "#ad-screenbg", "#ad-ui"], { opacity: 0 });
      gsap.set("#ad-inbox", { clipPath: "circle(0px at 46px 100px)" });
      gsap.set(".ad-bub", { opacity: 0 });
      gsap.set(".ad-av", { opacity: 0 });
      gsap.set(".ad-mini", { opacity: 0 });
      gsap.set([".bill"], { opacity: 0 });

      // the post builds around the badge, then the phone around the post
      tl.fromTo("#ad-ui", { opacity: 0, scale: 0.94, transformOrigin: "305px 216px" }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 0.05);
      tl.fromTo("#ad-screenbg", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.05);
      tl.fromTo("#ad-shell", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0.2);

      // «ممكن يضيّع فلوسك»: two bills slip out of the phone and fall away
      [["#ad-bill1", 2.0, -30], ["#ad-bill2", 2.3, -18]].forEach(([sel, t, rot]) => {
        tl.set(sel, { opacity: 1 }, t);
        tl.fromTo(sel, { x: 0, y: 0, rotation: 0 }, { x: -170, y: 20, rotation: rot / 3, duration: 0.35, ease: "expo.out" }, t);
        tl.to(sel, { y: 1400, rotation: rot, duration: 0.9, ease: "power3.in" }, t + 0.35);
      });

      // «هيوصّلك لناس أكتر»: people stream in from both sides, three at a time
      const fromX = [-520, 700, -480, 640, -560, 600, -500, 720, -540, 660, -470, 690];
      const fromY = [-120, 80, 160, -60, 40, -140, 120, -40, -90, 140, 60, -110];
      document.querySelectorAll(".ad-av").forEach((el, k) => {
        const t = 3.5 + Math.floor(k / 3) * 0.4 + (k % 3) * 0.06;
        tl.fromTo(el, { opacity: 0, x: fromX[k], y: fromY[k] }, { opacity: 1, x: 0, y: 0, duration: 0.6, ease: "expo.out" }, t);
      });

      // «بس لو مش بتقدّم قيمة، ولا المريض حس إنك تستاهل الثقة»: the people fade out one by one, unconvinced
      document.querySelectorAll(".ad-av").forEach((el, k) => {
        const order = [5, 0, 9, 3, 11, 7, 1, 10, 4, 8, 2, 6].indexOf(k);
        tl.to(el, { opacity: 0.25, y: 14, duration: 0.3, ease: "power2.in" }, 8.0 + order * 0.2);
      });

      // «حتى لو صرفت مليون إعلان»: the same ad multiplies around the phone
      document.querySelectorAll(".ad-mini").forEach((el, k) => {
        const rot = [-8, 7, 5, -6, -3, -4, 8, 3][k];
        tl.fromTo(el, { opacity: 0, scale: 0.75, rotation: 0 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.14, ease: "back.out(1.4)" }, 10.8 + k * 0.08);
      });

      // «هتلاقي النتيجة مش عاجباك»: everything greys out and sinks
      tl.to([".mini-gray", "#ad-gray"], { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 13.3);
      tl.to([".ad-mini", "#ad-phone"], { y: 40, duration: 0.4, ease: "power3.in" }, 13.3);
      
      // into the inbox: the copies leave, the phone rises back, an iris opens from the DM icon
      tl.to(".ad-mini", { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power3.in" }, 14.4);
      tl.to(".ad-av", { opacity: 0, duration: 0.2, ease: "power3.in" }, 14.4);
      tl.to("#ad-phone", { y: 0, duration: 0.4, ease: "power2.inOut" }, 14.45);
      tl.to("#ad-gray", { opacity: 0, duration: 0.2, ease: "none" }, 14.7);
      tl.to("#ad-badge", { opacity: 0, duration: 0.15, ease: "none" }, 14.7);
      tl.fromTo("#ad-inbox", { clipPath: "circle(0px at 46px 100px)" }, { clipPath: "circle(1200px at 46px 100px)", duration: 0.35, ease: "power3.out" }, 14.75);
      tl.set("#ad-ui", { opacity: 0 }, 15.15);

      // «السعر والفصال وخلاص»: four haggling messages, each from its sender's corner
      [15.6, 16.5, 17.4, 18.3].forEach((t, k) => {
        tl.fromTo(`#ad-b${k}`, { opacity: 0, scale: 0.75, transformOrigin: "100% 0%" }, { opacity: 1, scale: 1, duration: 0.12, ease: "back.out(1.4)" }, t);
      });

      // hand-off: the phone takes the left half of the split (scale 0.62, centre 317,805)
      tl.to("#ad-phone", { x: -193, y: 55, scale: 0.62, duration: 0.6, ease: "power2.inOut" }, 19.85);

      window.__timelines["ad"] = tl;
    })();
