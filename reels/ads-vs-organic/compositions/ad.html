      const WING_L = WING("M106 66 C102 30 70 6 4 4 C16 14 10 20 24 26 C14 32 26 38 38 40 C30 48 46 52 58 52 C54 60 80 66 106 66 Z");

      const FAN = [[190, 600, -10], [830, 620, 8], [160, 830, 6], [860, 850, -6], [210, 1050, -4], [810, 1060, 10]];
      const money = document.getElementById("ad-money");
      FAN.forEach(([x, y, r]) => {
        money.insertAdjacentHTML("beforeend", `<div class="fly" data-layout-ignore style="left: ${x}px; top: ${y}px"><svg class="wing l" viewBox="0 0 110 70">${WING_L}</svg><svg class="wing r" viewBox="0 0 110 70">${WING_R}</svg><div class="cash"></div></div>`);
      });
      const bills = [...document.querySelectorAll(".fly")];
      document.getElementById("ad-doc").innerHTML = person(DOCTOR, "addoc");

      // the phone sits at 0.86, lifted 60 px, so captions have the band under it
      gsap.set("#ad-phone", { scale: 0.86, y: -60 });
      gsap.set("#ad-badge", { scale: 0.25 });
      gsap.set(["#ad-shell", "#ad-screenbg", "#ad-ui", ".ad-mini", ".fly", ".wing", "#ad-doc"], { opacity: 0 });
      bills.forEach((el, i) => gsap.set(el, { x: 510 - FAN[i][0], y: 700 - FAN[i][1], scale: 0.4 }));
      gsap.set("#ad-doc", { scale: 1.75, filter: "saturate(1)" });
      ppl.forEach((el) => gsap.set(el, { opacity: 0, scale: +el.dataset.k, filter: "grayscale(0)" }));
      gsap.set(".ad-ring", { opacity: 0, scale: 0 });
      gsap.set(["#ad-b0", "#ad-b1", "#ad-b2", "#ad-b3"], { opacity: 0 });
      gsap.set("#ad-inbox", { clipPath: "circle(0px at 46px 100px)" });

      // the post builds around the badge, then the phone around the post
      tl.fromTo("#ad-ui", { opacity: 0, scale: 0.94, transformOrigin: "305px 216px" }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 0.05);
      tl.fromTo("#ad-screenbg", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.05);

      // «ممكن يضيّع فلوسك»: a fan of bills bursts out from behind the phone, grows wings and flies off
      bills.forEach((el, i) => {
        tl.to(el, { opacity: 1, x: 0, y: 0, scale: 1, rotation: FAN[i][2], duration: 0.35, ease: "back.out(1.8)" }, 2.82 + i * 0.04);

      bills.forEach((el, i) => {
        const wings = el.querySelectorAll(".wing");
        tl.fromTo(wings, { opacity: 1, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.18, ease: "back.out(2)" }, 3.22 + i * 0.03);
        tl.to(wings, { scaleY: 0.35, duration: 0.07, ease: "sine.inOut", yoyo: true, repeat: 15 }, 3.4 + i * 0.03);
        tl.to(el, { x: (FAN[i][0] < 510 ? -1 : 1) * (120 + i * 30), y: -(FAN[i][1] + 260), rotation: FAN[i][2] * 3, duration: 1.0, ease: "power2.in" }, 3.32 + i * 0.07);
      });

      // «الإعلان الممول»: the phone steps back and up to make room
      tl.to("#ad-phone", { scale: 0.58, y: -230, duration: 0.6, ease: "power3.inOut" }, 4.2);
      // «هيوصّلك لناس أكتر، أيوه»: the ad goes out in waves; people pop up one after another, nearest first
      document.querySelectorAll(".ad-ring").forEach((el, i) => {
        tl.fromTo(el, { scale: 0.05, opacity: 0.55 }, { scale: 1, opacity: 0, duration: 1.1, ease: "power1.out" }, [4.3, 6.0, 7.1][i]);
      });
      const byNear = ppl.map((el, i) => [Math.hypot(SPOTS[i][0] - 510, SPOTS[i][1] - 120 - 520), el]).sort((a, b) => a[0] - b[0]).map((e) => e[1]);
      byNear.forEach((el, k) => {
        const s = +el.dataset.k;
        // the first three burst in with the phone's step back, the rest arrive one after another on «الإعلان الممول هيوصّلك لناس أكتر»
        const t = k < 3 ? 4.35 + k * 0.25 : 6.0 + (k - 3) * 0.22;
        tl.fromTo(el, { opacity: 0, y: 110, scale: s * 0.45, rotation: k % 2 ? 12 : -12 }, { opacity: 1, y: 0, scale: s, rotation: 0, duration: 0.45, ease: "back.out(1.8)" }, t);

      // «أيوه»: the whole crowd nods once
      byNear.forEach((el, k) => {
        tl.to(el, { y: -18, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 8.62 + (k % 5) * 0.025);

      // «بس لو مش بتقدّم قيمة»: they go grey in a wave
      byNear.forEach((el, k) => {
        tl.to(el, { filter: "grayscale(1)", opacity: 0.6, duration: 0.3, ease: "power2.out" }, 9.6 + k * 0.05);

      // «ولا المريض حس إنك فعلاً تستاهل الثقة»: and walk off, one by one
      [5, 0, 9, 3, 11, 7, 1, 10, 4, 8, 2, 6, 12].forEach((i, k) => {
        tl.to(ppl[i], { y: 1800, rotation: k % 2 ? 14 : -14, duration: 0.6, ease: "power3.in" }, 11.1 + k * 0.17);

      // the phone comes forward again for the copies
      tl.to("#ad-phone", { scale: 0.86, y: -60, duration: 0.6, ease: "power3.inOut" }, 13.95);

      // «حتى لو صرفت مليون إعلان»: the same ad multiplies around the phone
      document.querySelectorAll(".ad-mini").forEach((el, k) => {
        const rot = [-8, 7, 5, -6, -3, -4, 8, 3][k];
        tl.fromTo(el, { opacity: 0, scale: 0.75, rotation: 0 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.14, ease: "back.out(1.4)" }, 16.45 + k * 0.08);
      });

      // «هتلاقي النتيجة»: the doctor steps in, smiling, expecting the result
      tl.fromTo("#ad-doc", { opacity: 0, y: 300 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 17.35);
      // «مش عاجباك»: the smile turns over, the brows fall, a big X lands on the ads
      tl.to("#ad-doc .mouth", { scaleY: -1, transformOrigin: "50% 50%", duration: 0.3, ease: "power2.inOut" }, 19.08);
      tl.to("#ad-doc .brow-l", { rotation: -16, transformOrigin: "50% 50%", duration: 0.3, ease: "power2.inOut" }, 19.08);
      tl.to("#ad-doc .brow-r", { rotation: 16, transformOrigin: "50% 50%", duration: 0.3, ease: "power2.inOut" }, 19.08);
      tl.to("#ad-doc", { y: 14, scale: 1.7, filter: "saturate(0.55)", duration: 0.4, ease: "power2.out" }, 19.1);
      tl.to("#ad-x path:nth-of-type(1)", { strokeDashoffset: 0, duration: 0.16, ease: "power2.in" }, 19.14);
      tl.to("#ad-x path:nth-of-type(2)", { strokeDashoffset: 0, duration: 0.16, ease: "power2.in" }, 19.32);
      tl.fromTo("#ad-x", { x: 16, y: -8 }, { x: 0, y: 0, duration: 0.3, ease: "elastic.out(1.2, 0.3)", immediateRender: false }, 19.48);
      // and everything behind it greys out (the phone holds still: a moving layer is lifted above the X by motion blur)
      tl.to([".mini-gray", "#ad-gray"], { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 19.1);

      // into the inbox: the copies leave, the phone rises back, an iris opens from the DM icon
      tl.to([".ad-mini", "#ad-x"], { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power3.in" }, 20.25);
      tl.to("#ad-doc", { opacity: 0, y: 320, duration: 0.3, ease: "power3.in" }, 20.2);
      tl.to(["#ad-gray", "#ad-badge"], { opacity: 0, duration: 0.15, ease: "none" }, 20.55);
      tl.to("#ad-inbox", { clipPath: "circle(1200px at 46px 100px)", duration: 0.35, ease: "power3.out" }, 20.6);
      tl.set("#ad-ui", { opacity: 0 }, 21.0);

      // «هيكلمك... مش جاد... السعر والفصال»: four haggling messages, each from its sender's corner
      [21.0, 22.2, 23.95, 24.4].forEach((t, k) => {
        tl.fromTo(`#ad-b${k}`, { opacity: 0, scale: 0.75, transformOrigin: "100% 0%" }, { opacity: 1, scale: 1, duration: 0.12, ease: "back.out(1.4)" }, t);
      });

      // hand-off: the phone takes the left half of the split (scale 0.62, centre 317,805)
      tl.to("#ad-phone", { x: -193, y: 55, scale: 0.62, duration: 0.6, ease: "power2.inOut" }, 25.25);

      // timed on the raw recording; tools/cut.py shortened its pauses, so each tween moves onto the cut (assets/voice/cut-map.json)
      const CUT = [[0,0],[0,0],[0.2255,0.05],[1.29556,1.1201],[1.56285,1.2401],[3.39146,3.0687],[3.62363,3.1887],[5.39494,4.96],[5.93273,5.12],[7.02081,6.2081],[8.24869,6.6081],[11.804,10.1634],[13.4734,10.3834],[14.5153,11.4253],[14.8545,11.5453],[16.3794,13.0702],[16.9229,13.2302],[18.2428,14.5501],[18.453,14.6701],[21.242,17.4591],[22.9578,17.6791],[24.8515,19.5728],[25.0868,19.6928],[27.1607,21.7667],[28.3368,21.9867],[30.4698,24.1197],[30.8643,24.2397],[32.7954,26.1708],[33.923,26.5708],[35.7522,28.4],[36.4682,28.56],[38.2572,30.349],[38.7384,30.509],[40.5258,32.2964],[40.9904,32.4564],[41.678,33.144],[41.9994,33.264],[43.3146,34.5792],[43.9455,34.7392],[46.5355,37.3292],[46.7506,37.4492],[48.3375,39.0361],[48.8516,39.4361],[48.853,39.4375],[49.0997,39.6842],[50.8561,41.4406],[51.2233,41.5606],[54.0706,44.4079],[54.644,44.8079],[55.6336,45.7975],[55.8604,45.9175],[56.6052,46.6623],[56.8552,46.7823],[57.4996,47.4267],[57.7276,47.5467],[58.335,48.1541],[58.6985,48.2741],[60.627,50.2026],[61.1581,50.3626],[63.1661,52.3706],[63.4033,52.4906],[64.9725,54.0598],[65.6285,54.4598],[67.4596,56.2909],[67.775,56.4109],[68.4966,57.1325],[68.9401,57.5325],[70.8214,59.4138],[71.0378,59.5338],[73.6102,62.1062],[74.4124,62.3262],[76.5251,64.4389],[77.3038,64.8389],[79.0656,66.6007],[79.4624,66.7207],[83.532,70.7903],[83.95,71.0403],[83.95,71.0403],[85.95,73.0403]];
      const cut = (t) => {
        let i = 1;
        while (i < CUT.length - 1 && CUT[i][0] < t) i++;
        const [a0, b0] = CUT[i - 1], [a1, b1] = CUT[i];
        return a1 === a0 ? b1 : b0 + ((b1 - b0) * (t - a0)) / (a1 - a0);
      };
      const retime = (tl, from, to) => {
        const s0 = cut(from), len = cut(to) - s0;
        tl.getChildren(false, true, true).forEach((c) => {
          const a = c.startTime(), d = c.totalDuration();
          let na = cut(from + a) - s0, nd = cut(from + a + d) - s0 - na;
          if (d > 0) {
            nd = Math.min(Math.max(nd, d * 0.5), len); // a pause can speed a move up, never past 2x
            na = Math.min(Math.max(na, 0), len - nd); // and nothing spills past the scene's ends
            c.timeScale(d / nd);
          }
          c.startTime(na);
        });
        // timeScale() renders a tween once, which records its start values too early (before the tweens
        // ahead of it have run); forget them so each tween reads its start when the playhead reaches it
        tl.invalidate();
      };
      retime(tl, 7.5, 33.4);
      window.__timelines["ad"] = tl;
    })();
