  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // the lens centre drives both the ring (x/y from 510,760) and the magnified copy (--lx/--ly on its wrapper)
      const lensTo = (lx, ly, t, d, ease) => {
        tl.to("#lens-ring", { x: lx - 510, y: ly - 760, duration: d, ease }, t);
        tl.to("#lens-magwrap", { "--lx": lx + "px", "--ly": ly + "px", duration: d, ease }, t);
      };

      gsap.set(".lens-in", { opacity: 0 });
      gsap.set(".lens-hag", { opacity: 0 });
      gsap.set("#lens-magwrap", { opacity: 0 });
      gsap.set("#lens-handle", { rotation: -45, scaleY: 0 });

      // the coral disc opens into a lens: the fill drains, the handle grows, the stage arrives
      tl.to("#lens-disc", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 0.1);
      tl.to("#lens-handle", { scaleY: 1, duration: 0.35, ease: "expo.out" }, 0.25);
      tl.fromTo(".lens-in", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out", stagger: 0.06 }, 0.2);
      tl.set("#lens-magwrap", { opacity: 1 }, 0.45);

      // «لو الأساس محتوى قيّم... الإعلان هيكبّر ده»: over the content card, then a slow read across it
      lensTo(640, 420, 0.6, 0.8, "power2.inOut");
      lensTo(400, 440, 1.6, 2.6, "power1.inOut");

      // «إنما لو الأساس عروض وخصومات، برضه هيكبّر ده»: over the deal; the haggling arrives with it
      lensTo(640, 950, 4.5, 0.8, "power2.inOut");
      tl.fromTo(".lens-hag", { opacity: 0, scale: 0.75, transformOrigin: "100% 0%" }, { opacity: 1, scale: 1, duration: 0.12, ease: "back.out(1.4)", stagger: 0.5 }, 5.6);
      lensTo(380, 960, 5.5, 2.6, "power1.inOut");

      // the lens pulls back and the stage clears for the foundation
      tl.to("#lens-ring", { scale: 0.6, opacity: 0, y: "-=120", duration: 0.35, ease: "power3.in" }, 8.4);
      tl.to("#lens-magwrap", { opacity: 0, duration: 0.2, ease: "none" }, 8.4);
      tl.to(["#lens-base .lens-in", "#lens-base .lens-hag"], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 8.65);

      window.__timelines["lens"] = tl;
    })();
  </script>
