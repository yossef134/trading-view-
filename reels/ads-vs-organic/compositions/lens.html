<template>
  <style>
    @font-face {
      font-family: "Rubik";
      src: url("assets/fonts/rubik-arabic.woff2") format("woff2");
      font-weight: 300 900;
      unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC;
    }
    @font-face {
      font-family: "Rubik";
      src: url("assets/fonts/rubik-latin.woff2") format("woff2");
      font-weight: 300 900;
      unicode-range: U+0000-00FF, U+2000-206F;
    }
    @font-face {
      font-family: "Indie Flower";
      src: url("assets/fonts/indieflower-latin.woff2") format("woff2");
      font-weight: 400;
    }
    #root {
      position: absolute;
      inset: 0;
      font-family: "Rubik", sans-serif;
      font-weight: 500;
      color: var(--color-ink);
    }
    #root .en { font-family: "Indie Flower", cursive; font-weight: 700; -webkit-text-stroke: 1.2px currentColor; font-size: 1.3em; direction: ltr; unicode-bidi: isolate; }
    #root .t { position: absolute; left: 80px; width: 860px; text-align: center; direction: rtl; white-space: nowrap; }
    /* graph paper (from the references): 60 px cells, a dot every 240 px; the root ground puts dots at x 60+240k, y 120+240k */
    #root .paper { background-color: #ffffff; background-image: radial-gradient(circle, rgba(19, 33, 63, 0.2) 3px, transparent 3.5px), linear-gradient(rgba(19, 33, 63, 0.07) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(19, 33, 63, 0.07) 1.5px, transparent 1.5px); background-size: 240px 240px, 60px 60px, 60px 60px; }
    #root .paper-on-orange { background-image: linear-gradient(rgba(255, 255, 255, 0.16) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255, 255, 255, 0.16) 1.5px, transparent 1.5px); background-size: 60px 60px, 60px 60px; }
    #root .w { display: inline-block; }
    #root .ppl { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 12px 14px rgba(19, 33, 63, 0.2)); }

    /* a camera over one big sheet of graph paper: station A (content) at home, station B (offers) one frame below */
    #lens-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #lens-paper { position: absolute; left: -1080px; top: -1920px; width: 3240px; height: 5760px; background-position: 60px 0, 0 0, 0 0; }
    #root .k { position: absolute; left: 80px; width: 860px; text-align: center; direction: rtl; white-space: nowrap; font-size: 84px; }
    #root .lc { position: absolute; width: 360px; height: 250px; margin: -125px 0 0 -180px; background: #ffffff; border: 6px solid var(--color-ink); border-radius: 34px; box-shadow: 0 18px 30px rgba(19, 33, 63, 0.16); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; direction: rtl; font-size: 58px; white-space: nowrap; }
    #root .lc svg { width: 84px; height: 84px; }
    #root .lo { position: absolute; color: var(--color-ad-ink); direction: rtl; white-space: nowrap; }
    #root .lo svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 14px 22px rgba(19, 33, 63, 0.14)); }
    #root .lo span { position: absolute; left: 0; right: 0; text-align: center; }
    #root .lp { position: absolute; width: 200px; height: 247px; margin: -247px 0 0 -100px; transform-origin: 50% 100%; }
    #root .lb { position: absolute; display: flex; align-items: center; gap: 14px; direction: rtl; white-space: nowrap; background: #ffffff; border: 5px solid var(--color-ink); border-radius: 40px; border-bottom-right-radius: 10px; padding: 14px 30px; font-size: 50px; box-shadow: 0 14px 24px rgba(19, 33, 63, 0.14); }
    #root .lb svg { width: 50px; height: 50px; }
    #root .lh { position: absolute; background: var(--color-ad-bubble); color: var(--color-ad-ink); font-size: 48px; padding: 12px 28px; border-radius: 36px; border-top-right-radius: 10px; white-space: nowrap; direction: rtl; box-shadow: 0 10px 20px rgba(19, 33, 63, 0.1); }
    #root .heart { position: absolute; width: 64px; height: 64px; }
    #root .arrow { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
    /* the ad as a magnifying glass: 360 px, born from the stairs' orange block at 510,760 */
    #lens-ring { position: absolute; left: 330px; top: 580px; width: 360px; height: 360px; }
    #lens-disc { position: absolute; inset: 0; border-radius: 50%; background: var(--color-accent); }
    #lens-rim { position: absolute; inset: 0; border-radius: 50%; border: 16px solid var(--color-accent); background: rgba(255, 255, 255, 0.18); }
    #lens-handle { position: absolute; left: 300px; top: 300px; width: 44px; height: 200px; border-radius: 22px; background: var(--color-ink); transform-origin: 50% 0%; }
  </style>
  <div id="root" data-composition-id="lens" data-width="1080" data-height="1920">
    <div id="lens-cam" data-layout-allow-overlap>
      <div id="lens-paper" class="paper" data-layout-ignore></div>

      <!-- station A: «لو الأساس بتاعك محتوى قيّم ومعلومات ونصايح» -->
      <div class="k" id="lens-k1" style="top: 230px"><span class="w">لو</span> <span class="w">الأساس</span> <span class="w">بتاعك</span></div>
      <div class="lc" id="lens-c1" style="left: 300px; top: 640px"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="42" fill="#13213F" /><path d="M34 26 L60 42 L34 58 Z" fill="#FFFFFF" /></svg>محتوى قيّم</div>
      <div class="lc" id="lens-c2" style="left: 750px; top: 610px"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="42" fill="#13213F" /><circle cx="42" cy="24" r="6" fill="#FFFFFF" /><rect x="36" y="36" width="12" height="30" rx="6" fill="#FFFFFF" /></svg>معلومات</div>
      <div class="lc" id="lens-c3" style="left: 520px; top: 900px"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="42" fill="#13213F" /><path d="M42 18 a17 17 0 0 0 -10 30.5 c2 2 3 4.5 3 7.5 h14 c0 -3 1 -5.5 3 -7.5 A17 17 0 0 0 42 18 z" fill="#FFFFFF" /><rect x="35" y="59" width="14" height="5" rx="2.5" fill="#FFFFFF" /></svg>نصايح</div>
      <svg class="arrow" id="lens-arrA" data-layout-ignore>
        <defs><mask id="lens-arrA-m" maskUnits="userSpaceOnUse" x="800" y="450" width="500" height="400"><path class="draw" d="M 1000 640 C 1060 540, 1130 560, 1175 650" pathLength="100" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-dasharray="100 110" stroke-dashoffset="100" /></mask></defs>
        <path d="M 1000 640 C 1060 540, 1130 560, 1175 650" fill="none" stroke="#13213F" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 22" mask="url(#lens-arrA-m)" />
        <path class="head" d="M 1144 636 L 1175 650 L 1177 616" fill="none" stroke="#13213F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="lp" id="lens-pA" style="left: 1330px; top: 870px"></div>
      <div class="lb" id="lens-thanks" style="left: 980px; top: 400px"><svg viewBox="0 0 100 90"><path d="M50 84 C18 62 6 46 6 30 A22 22 0 0 1 50 22 A22 22 0 0 1 94 30 C94 46 82 62 50 84 Z" fill="#13213F" /></svg>شكراً يا دكتور</div>
      <svg class="heart" id="lens-h1" viewBox="0 0 100 90" style="left: 1390px; top: 470px"><path d="M50 84 C18 62 6 46 6 30 A22 22 0 0 1 50 22 A22 22 0 0 1 94 30 C94 46 82 62 50 84 Z" fill="#13213F" /></svg>
      <svg class="heart" id="lens-h2" viewBox="0 0 100 90" style="left: 1420px; top: 560px; width: 46px; height: 46px"><path d="M50 84 C18 62 6 46 6 30 A22 22 0 0 1 50 22 A22 22 0 0 1 94 30 C94 46 82 62 50 84 Z" fill="#13213F" /></svg>

      <!-- station B, one frame down: «إنما لو الأساس عروض وخصومات» -->
      <div class="k" id="lens-k2" style="top: 2150px"><span class="w">إنما</span> <span class="w">لو</span> <span class="w">الأساس</span></div>
      <div class="lo" id="lens-o1" style="left: 160px; top: 2515px; width: 340px; height: 170px; font-size: 78px"><svg viewBox="0 0 340 170"><path d="M8 85 L74 12 H318 a14 14 0 0 1 14 14 V144 a14 14 0 0 1 -14 14 H74 Z" fill="#E9ECF2" stroke="#5A6378" stroke-width="6" stroke-linejoin="round" /><circle cx="64" cy="85" r="14" fill="#FFFFFF" stroke="#5A6378" stroke-width="6" /></svg><span style="top: 32px; padding-left: 70px">عروض</span></div>
      <div class="lo" id="lens-o2" style="left: 580px; top: 2520px; width: 330px; height: 330px"><svg viewBox="0 0 330 330"><polygon id="lens-star" fill="#E9ECF2" stroke="#5A6378" stroke-width="6" stroke-linejoin="round" points="" /></svg><span style="top: 70px; font-size: 110px; line-height: 1">٪</span><span style="top: 190px; font-size: 54px">خصومات</span></div>
      <svg class="arrow" id="lens-arrB" data-layout-ignore>
        <defs><mask id="lens-arrB-m" maskUnits="userSpaceOnUse" x="-200" y="2600" width="450" height="300"><path class="draw" d="M 150 2700 C 90 2800, 0 2800, -40 2730" pathLength="100" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-dasharray="100 110" stroke-dashoffset="100" /></mask></defs>
        <path d="M 150 2700 C 90 2800, 0 2800, -40 2730" fill="none" stroke="#13213F" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 22" mask="url(#lens-arrB-m)" />
        <path class="head" d="M -43 2764 L -40 2730 L -9 2745" fill="none" stroke="#13213F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="lp" id="lens-pB" style="left: -260px; top: 2800px"></div>
      <div class="lh" id="lens-q1" style="left: -170px; top: 2230px">آخر سعر كام؟</div>
      <div class="lh" id="lens-q2" style="left: -120px; top: 2350px">بكام؟</div>
      <div class="lh" id="lens-q3" style="left: 40px; top: 2470px">فيه خصم؟</div>

      <!-- the lens rides on the paper with everything else -->
      <div id="lens-ring">
        <div id="lens-handle"></div>
        <div id="lens-rim"></div>
        <div id="lens-disc"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
    // flat sticker people (white cut-out edge + soft shadow, after the collage stickers in the references)
    // spec: g = "m" man | "h" woman in hijab | "f" woman; skin, hair, top, scarf; beard, stache, glasses
    const PERSON_EDGE = '<filter id="ppl-edge-ID" x="-12%" y="-12%" width="124%" height="124%"><feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/><feFlood flood-color="#ffffff"/><feComposite in2="d" operator="in" result="e"/><feMerge><feMergeNode in="e"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
    const person = (p, uid) => {
      const ink = "#13213F", S = p.skin, H = p.hair || "#2B2118";
      const face = (cy) =>
        `<path d="M74 ${cy - 16} q9 -6 18 0 M108 ${cy - 16} q9 -6 18 0" stroke="${p.g === "h" ? ink : H}" stroke-width="4.5" fill="none" stroke-linecap="round"/>` +
        `<circle cx="83" cy="${cy}" r="5.5" fill="${ink}"/><circle cx="117" cy="${cy}" r="5.5" fill="${ink}"/>` +
        `<circle cx="70" cy="${cy + 16}" r="8" fill="#F28C6B" opacity=".25"/><circle cx="130" cy="${cy + 16}" r="8" fill="#F28C6B" opacity=".25"/>` +
        (p.glasses ? `<g fill="none" stroke="${ink}" stroke-width="4"><circle cx="83" cy="${cy}" r="15"/><circle cx="117" cy="${cy}" r="15"/><path d="M98 ${cy} h4"/></g>` : "") +
        (p.beard ? `<path d="M57 ${cy + 2} C58 ${cy + 46} 78 ${cy + 58} 100 ${cy + 58} C122 ${cy + 58} 142 ${cy + 46} 143 ${cy + 2} C138 ${cy + 24} 128 ${cy + 32} 118 ${cy + 26} C110 ${cy + 22} 90 ${cy + 22} 82 ${cy + 26} C72 ${cy + 32} 62 ${cy + 24} 57 ${cy + 2} Z" fill="${H}"/>` : "") +
        (p.stache || p.beard ? `<path d="M83 ${cy + 25} C91 ${cy + 18} 109 ${cy + 18} 117 ${cy + 25} C108 ${cy + 28} 92 ${cy + 28} 83 ${cy + 25} Z" fill="${H}"/>` : "") +
        `<path d="M89 ${cy + 31} Q100 ${cy + 40} 111 ${cy + 31}" stroke="${p.beard ? "#ffffff" : ink}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
      let g = `<path d="M12 252 C12 198 46 172 100 172 C154 172 188 198 188 252 Z" fill="${p.top}"/>`;
      if (p.g === "h") {
        g += `<path d="M100 40 C58 40 42 76 44 114 C45 148 54 170 64 184 C40 192 22 210 18 252 L182 252 C178 210 160 192 136 184 C146 170 155 148 156 114 C158 76 142 40 100 40 Z" fill="${p.scarf}"/>`;
        g += `<path d="M64 184 C82 200 118 200 136 184" stroke="${ink}" stroke-opacity=".18" stroke-width="5" fill="none"/>`;
        g += `<ellipse cx="100" cy="114" rx="37" ry="45" fill="${S}"/>` + face(108);
      } else {
        g += `<path d="M84 146 L116 146 L116 182 C110 192 90 192 84 182 Z" fill="${S}"/><path d="M84 160 L116 160 L116 170 C108 176 92 176 84 170 Z" fill="${ink}" opacity=".12"/>`;
        if (p.g === "f") g += `<path d="M50 112 C46 62 72 42 100 42 C130 42 154 62 150 112 C152 150 148 180 142 196 L58 196 C52 180 48 150 50 112 Z" fill="${H}"/>`;
        else g += `<path d="M84 176 L100 204 L116 176" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="6" stroke-linejoin="round"/>`;
        g += `<circle cx="56" cy="110" r="10" fill="${S}"/><circle cx="144" cy="110" r="10" fill="${S}"/>`;
        g += `<ellipse cx="100" cy="106" rx="44" ry="52" fill="${S}"/>`;
        g += p.g === "f"
          ? `<path d="M56 100 C58 62 82 52 102 54 C126 56 142 70 144 100 C132 84 114 76 98 78 C80 82 66 90 56 100 Z" fill="${H}"/>`
          : `<path d="M56 104 C52 62 74 44 100 44 C128 44 150 62 144 104 C140 86 132 76 118 72 C102 80 78 78 62 84 C58 90 57 96 56 104 Z" fill="${H}"/>`;
        g += face(104);
      }
      return `<svg class="ppl" viewBox="-10 -10 220 272"><defs>${PERSON_EDGE.replace("ID", uid)}</defs><g filter="url(#ppl-edge-${uid})">${g}</g></svg>`;
    };
    const SKIN = ["#F2C7A5", "#E3AE88", "#C98F66", "#9C6644"];
    const PEOPLE = [
      { g: "h", skin: SKIN[1], scarf: "#2D4A7A", top: "#2D4A7A" },
      { g: "m", skin: SKIN[2], hair: "#2B2118", top: "#13213F", beard: true },
      { g: "h", skin: SKIN[0], scarf: "#C9D2E3", top: "#7D8597" },
      { g: "m", skin: SKIN[1], hair: "#1E1A17", top: "#C9D2E3", glasses: true },
      { g: "f", skin: SKIN[0], hair: "#4A3426", top: "#13213F" },
      { g: "m", skin: SKIN[3], hair: "#1E1A17", top: "#7D8597", stache: true },
      { g: "h", skin: SKIN[2], scarf: "#13213F", top: "#C9D2E3" },
      { g: "m", skin: SKIN[0], hair: "#8A8F99", top: "#2D4A7A", glasses: true, stache: true },
      { g: "h", skin: SKIN[1], scarf: "#FFD9C2", top: "#13213F" },
      { g: "m", skin: SKIN[1], hair: "#2B2118", top: "#DCE1EA" },
      { g: "h", skin: SKIN[3], scarf: "#7D8597", top: "#2D4A7A" },
      { g: "m", skin: SKIN[2], hair: "#2B2118", top: "#2D4A7A", beard: true, glasses: true },
      { g: "f", skin: SKIN[2], hair: "#1E1A17", top: "#C9D2E3" },
    ];

      document.getElementById("lens-pA").innerHTML = person(PEOPLE[0], "lensA");
      document.getElementById("lens-pB").innerHTML = person(PEOPLE[1], "lensB");
      // an 18-point price burst
      document.getElementById("lens-star").setAttribute("points", Array.from({ length: 36 }, (_, i) => {
        const r = i % 2 ? 132 : 160, a = (i / 36) * Math.PI * 2;
        return (165 + r * Math.sin(a)).toFixed(1) + "," + (165 - r * Math.cos(a)).toFixed(1);
      }).join(" "));

      // camera: a viewport point = world * s + (x, y); "frame(wx, wy, s)" puts the world point at 540,760
      const frame = (wx, wy, s) => ({ x: 540 - wx * s, y: 760 - wy * s, scale: s });
      // a slow push that keeps world point wx,wy where it already sits on screen (vx,vy)
      const push = (wx, wy, vx, vy, s) => ({ x: vx - wx * s, y: vy - wy * s, scale: s });
      const lensAt = (wx, wy, s, t, d, ease) => tl.to("#lens-ring", { x: wx - 510, y: wy - 760, scale: s, duration: d, ease }, t);
      const words = (sel, times) => times.forEach((t, i) => {
        tl.fromTo(`${sel} .w:nth-of-type(${i + 1})`, { opacity: 0, y: 46, scale: 1.25 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "back.out(2)" }, t);
      });
      const pop = (sel, t, from) => tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, x: 0, y: 0, scale: 1, rotation: gsap.getProperty(sel, "rotation"), duration: 0.5, ease: "back.out(1.7)" }, t);

      gsap.set("#lens-cam", { x: 0, y: 0, scale: 1 });
      gsap.set("#lens-handle", { rotation: -45, scaleY: 0 });
      gsap.set(["#lens-k1 .w", "#lens-k2 .w", ".lc", ".lo", ".lp", ".lb", ".lh", ".heart", ".arrow .head"], { opacity: 0 });
      gsap.set("#lens-c1", { rotation: -7 }); gsap.set("#lens-c2", { rotation: 6 }); gsap.set("#lens-c3", { rotation: -3 });
      gsap.set("#lens-o1", { rotation: -10 }); gsap.set("#lens-o2", { rotation: 8 });
      gsap.set(".lp", { scale: 1.5 });

      // the orange block opens into a magnifying glass, then steps aside
      tl.to("#lens-disc", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 0.05);
      tl.to("#lens-handle", { scaleY: 1, duration: 0.35, ease: "expo.out" }, 0.2);
      lensAt(880, 1040, 0.62, 0.55, 0.6, "power3.inOut");

      // «لو الأساس بتاعك»
      words("#lens-k1", [0.14, 0.42, 0.74]);
      // «محتوى قيّم / ومعلومات / ونصايح»: one sticker per word, each thrown in from its own side
      pop("#lens-c1", 1.32, { x: -520, y: -140, rotation: -40, scale: 0.6 });
      pop("#lens-c2", 2.12, { x: 520, y: -200, rotation: 40, scale: 0.6 });
      pop("#lens-c3", 2.9, { x: 120, y: 700, rotation: -25, scale: 0.6 });
      tl.to("#lens-cam", { ...push(510, 720, 510, 720, 1.06), duration: 2.4, ease: "power1.inOut" }, 1.25);

      // «الإعلان هيكبّر ده للمريض»: the glass swoops over the content and blows it up
      lensAt(520, 740, 1.3, 3.74, 0.5, "power3.inOut");
      tl.to(".lc", { scale: 1.32, duration: 0.45, ease: "back.out(2.5)", stagger: 0.05 }, 4.34);
      tl.fromTo("#lens-rim", { scale: 1 }, { scale: 1.12, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, 4.34);
      // ...and follow the line to the patient
      tl.to("#lens-cam", { ...frame(900, 720, 0.92), duration: 0.75, ease: "power2.inOut" }, 4.6);
      tl.to("#lens-arrA .draw", { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 4.62);
      tl.fromTo("#lens-arrA .head", { opacity: 0, scale: 0.4, transformOrigin: "1175px 650px" }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, 5.02);
      tl.fromTo("#lens-pA", { opacity: 0, y: 160, scale: 0.7 }, { opacity: 1, y: 0, scale: 1.5, duration: 0.45, ease: "back.out(1.8)" }, 4.92);
      tl.fromTo("#lens-thanks", { opacity: 0, scale: 0.5, transformOrigin: "100% 100%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 5.05);
      tl.fromTo("#lens-h1", { opacity: 0, y: 40, scale: 0.4 }, { opacity: 1, y: -60, scale: 1, rotation: 10, duration: 0.6, ease: "power2.out" }, 5.15);
      tl.fromTo("#lens-h2", { opacity: 0, y: 40, scale: 0.4 }, { opacity: 1, y: -50, scale: 1, rotation: -12, duration: 0.6, ease: "power2.out" }, 5.3);
      tl.to(".lc", { scale: 1, duration: 0.4, ease: "power2.inOut" }, 5.3);

      // «إنما لو الأساس»: whip down to the other foundation; the glass comes along
      tl.to("#lens-cam", { x: 0, y: -1920, scale: 1, duration: 0.36, ease: "power3.inOut" }, 5.74);
      lensAt(880, 1920 + 1040, 0.62, 5.74, 0.45, "power3.inOut");
      words("#lens-k2", [6.06, 6.16, 6.28]);
      // «عروض / وخصومات»
      pop("#lens-o1", 6.7, { x: -480, y: -300, rotation: -200, scale: 0.4 });
      pop("#lens-o2", 7.24, { x: 420, y: -380, rotation: 160, scale: 0.4 });
      tl.to("#lens-cam", { ...push(540, 2640, 540, 720, 1.06), duration: 1.7, ease: "power1.inOut" }, 6.1);

      // «برضه هيكبّر ده للمريض»: the same glass, the same blow-up
      lensAt(540, 1920 + 700, 1.3, 7.84, 0.5, "power3.inOut");
      tl.to(".lo", { scale: 1.3, duration: 0.45, ease: "back.out(2.5)", stagger: 0.05 }, 8.56);
      tl.fromTo("#lens-rim", { scale: 1 }, { scale: 1.12, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 8.56);
      tl.to("#lens-cam", { ...frame(140, 2650, 0.92), duration: 0.6, ease: "power2.inOut" }, 8.62);
      tl.to("#lens-arrB .draw", { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 8.64);
      tl.fromTo("#lens-arrB .head", { opacity: 0, scale: 0.4, transformOrigin: "-40px 2730px" }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, 9.0);
      tl.fromTo("#lens-pB", { opacity: 0, y: 160, scale: 0.7 }, { opacity: 1, y: 0, scale: 1.5, duration: 0.4, ease: "back.out(1.8)" }, 8.72);
      ["#lens-q2", "#lens-q3", "#lens-q1"].forEach((q, i) => {
        tl.fromTo(q, { opacity: 0, scale: 0.5, transformOrigin: "100% 100%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, 8.84 + i * 0.11);
