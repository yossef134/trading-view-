      <div class="mini ad-mini" data-layout-allow-overlap style="left: 280px; top: 90px"><div class="mini-badge">إعلان ممول</div><div class="mini-img">خصم على الكشف</div><div class="mini-gray"></div></div>
      <div class="mini ad-mini" data-layout-allow-overlap style="left: 70px; top: 930px"><div class="mini-badge">إعلان ممول</div><div class="mini-img">خصم على الكشف</div><div class="mini-gray"></div></div>
      <div class="mini ad-mini" data-layout-allow-overlap style="left: 500px; top: 940px"><div class="mini-badge">إعلان ممول</div><div class="mini-img">خصم على الكشف</div><div class="mini-gray"></div></div>
      <div class="mini ad-mini" data-layout-allow-overlap style="left: 280px; top: 490px"><div class="mini-badge">إعلان ممول</div><div class="mini-img">خصم على الكشف</div><div class="mini-gray"></div></div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
/*PEOPLE*/
      // [x of the feet, y of the feet, scale]: two rows under the phone, two on each side of it
      const SPOTS = [[130, 1140, 0.95], [320, 1140, 0.95], [510, 1140, 0.95], [700, 1140, 0.95], [890, 1140, 0.95],
        [225, 990, 0.8], [415, 990, 0.8], [605, 990, 0.8], [795, 990, 0.8],
        [190, 700, 0.75], [850, 700, 0.75], [175, 445, 0.72], [865, 445, 0.72]];
      const crowd = document.getElementById("ad-crowd");
      SPOTS.forEach(([x, y, k], i) => {
        const d = document.createElement("div");
        d.className = "ad-p";
        d.style.left = x + "px"; d.style.top = y + "px"; d.style.zIndex = y > 1100 ? 3 : y > 900 ? 2 : 1;
        d.innerHTML = person(PEOPLE[i], "ad" + i);
        d.dataset.k = k;
        crowd.appendChild(d);
      });
      const ppl = [...document.querySelectorAll(".ad-p")];

      // the phone sits at 0.86, lifted 60 px, so captions have the band under it
      gsap.set("#ad-phone", { scale: 0.86, y: -60 });
      gsap.set("#ad-badge", { scale: 0.25 });
      gsap.set(["#ad-shell", "#ad-screenbg", "#ad-ui", ".ad-mini", ".bill"], { opacity: 0 });
      ppl.forEach((el) => gsap.set(el, { opacity: 0, scale: +el.dataset.k, filter: "grayscale(0)" }));
      gsap.set(".ad-ring", { opacity: 0, scale: 0 });
      gsap.set(["#ad-b0", "#ad-b1", "#ad-b2", "#ad-b3"], { opacity: 0 });
      gsap.set("#ad-inbox", { clipPath: "circle(0px at 46px 100px)" });

      // the post builds around the badge, then the phone around the post
      tl.fromTo("#ad-ui", { opacity: 0, scale: 0.94, transformOrigin: "305px 216px" }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 0.05);
      tl.fromTo("#ad-screenbg", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.05);
      tl.fromTo("#ad-shell", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0.2);

      // «ممكن يضيّع فلوسك»: two bills slip out of the phone and fall away
      [["#ad-bill1", 3.25, -30], ["#ad-bill2", 3.55, -18]].forEach(([sel, t, rot]) => {
        tl.set(sel, { opacity: 1 }, t);
        tl.fromTo(sel, { x: 0, y: 0, rotation: 0 }, { x: -190, y: 20, rotation: rot / 3, duration: 0.35, ease: "expo.out" }, t);
        tl.to(sel, { y: 1700, rotation: rot, duration: 0.9, ease: "power3.in" }, t + 0.35);
        tl.set(sel, { opacity: 0 }, t + 1.3);
      });

      // «الإعلان الممول»: the phone steps back and up to make room
      tl.to("#ad-phone", { scale: 0.58, y: -230, duration: 0.6, ease: "power3.inOut" }, 5.95);
      // «هيوصّلك لناس أكتر، أيوه»: the ad goes out in waves; people pop up one after another, nearest first
      document.querySelectorAll(".ad-ring").forEach((el, i) => {
        tl.fromTo(el, { scale: 0.05, opacity: 0.55 }, { scale: 1, opacity: 0, duration: 1.1, ease: "power1.out" }, 7.3 + i * 0.45);
      });
      const byNear = ppl.map((el, i) => [Math.hypot(SPOTS[i][0] - 510, SPOTS[i][1] - 120 - 520), el]).sort((a, b) => a[0] - b[0]).map((e) => e[1]);
      byNear.forEach((el, k) => {
        const s = +el.dataset.k;
        tl.fromTo(el, { opacity: 0, y: 110, scale: s * 0.45, rotation: k % 2 ? 12 : -12 }, { opacity: 1, y: 0, scale: s, rotation: 0, duration: 0.45, ease: "back.out(1.8)" }, 7.35 + k * 0.1);
      });
      // «أيوه»: the whole crowd nods once
      byNear.forEach((el, k) => {
        tl.to(el, { y: -18, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 8.62 + (k % 5) * 0.025);
      });
      // «بس لو مش بتقدّم قيمة»: they go grey in a wave
      byNear.forEach((el, k) => {
        tl.to(el, { filter: "grayscale(1)", opacity: 0.6, duration: 0.3, ease: "power2.out" }, 9.6 + k * 0.05);
      });
      // «ولا المريض حس إنك فعلاً تستاهل الثقة»: and walk off, one by one
      [5, 0, 9, 3, 11, 7, 1, 10, 4, 8, 2, 6, 12].forEach((i, k) => {
        tl.to(ppl[i], { y: 1800, rotation: k % 2 ? 14 : -14, duration: 0.6, ease: "power3.in" }, 11.1 + k * 0.17);
      });
      // the phone comes forward again for the copies
      tl.to("#ad-phone", { scale: 0.86, y: -60, duration: 0.6, ease: "power3.inOut" }, 13.95);

      // «حتى لو صرفت مليون إعلان»: the same ad multiplies around the phone
      document.querySelectorAll(".ad-mini").forEach((el, k) => {
        const rot = [-8, 7, 5, -6, -3, -4, 8, 3][k];
        tl.fromTo(el, { opacity: 0, scale: 0.75, rotation: 0 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.14, ease: "back.out(1.4)" }, 16.45 + k * 0.08);
      });

      // «هتلاقي النتيجة مش عاجباك»: everything greys out and sinks
      tl.to([".mini-gray", "#ad-gray"], { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 19.1);
      tl.to("#ad-phone", { y: -20, duration: 0.4, ease: "power3.in" }, 19.1);

      // into the inbox: the copies leave, the phone rises back, an iris opens from the DM icon
      tl.to(".ad-mini", { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power3.in" }, 20.25);
      tl.to("#ad-phone", { y: -60, duration: 0.4, ease: "power2.inOut" }, 20.3);
      tl.to(["#ad-gray", "#ad-badge"], { opacity: 0, duration: 0.15, ease: "none" }, 20.55);
      tl.to("#ad-inbox", { clipPath: "circle(1200px at 46px 100px)", duration: 0.35, ease: "power3.out" }, 20.6);
      tl.set("#ad-ui", { opacity: 0 }, 21.0);

      // «هيكلمك... مش جاد... السعر والفصال»: four haggling messages, each from its sender's corner
      [21.0, 22.2, 23.95, 24.4].forEach((t, k) => {
        tl.fromTo(`#ad-b${k}`, { opacity: 0, scale: 0.75, transformOrigin: "100% 0%" }, { opacity: 1, scale: 1, duration: 0.12, ease: "back.out(1.4)" }, t);
      });

      // hand-off: the phone takes the left half of the split (scale 0.62, centre 317,805)
      tl.to("#ad-phone", { x: -193, y: 55, scale: 0.62, duration: 0.6, ease: "power2.inOut" }, 25.25);

      /*RETIME*/
      retime(tl, 7.5, 33.4);
      window.__timelines["ad"] = tl;
    })();
  </script>
