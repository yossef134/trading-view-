  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // eight short strokes around the button for the tap
      const burst = document.getElementById("end-burst");
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + 0.2, cx = 510, cy = 640;
        const x1 = cx + Math.cos(a) * 300, y1 = cy + Math.sin(a) * 110, x2 = cx + Math.cos(a) * 360, y2 = cy + Math.sin(a) * 150;

      }
      const pop = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 40, scale: 1.3 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, t);

      gsap.set(["#end-cta .w", "#end-follow", "#end-done", "#end-ana", "#end-name", "#end-sub .w", ".stk", "#end-hand", ".ray", "#end-ripple"], { opacity: 0 });
      gsap.set("#end-field", { clipPath: "inset(0px 0px 0px 0px round 0px)" });
      gsap.set("#end-arrow-head", { opacity: 0 });
      gsap.set("#end-hi", { scaleX: 0 });
      gsap.set("#end-s1", { rotation: -10 }); gsap.set("#end-s2", { rotation: 9 }); gsap.set("#end-s3", { rotation: -6 });

      // the orange field contracts into the follow button (520 x 130 at 250,575)

      tl.fromTo("#end-follow", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.4)" }, 0.5);
      // «متنساش / الفولو»
      pop("#end-cta .w:nth-of-type(1)", 0.26);
      pop("#end-cta .w:nth-of-type(2)", 0.9);
      // a hand whips in from the corner and taps it
      tl.set("#end-hand", { opacity: 1 }, 0.72);
      tl.fromTo("#end-hand", { x: 520, y: 900, rotation: 28, transformOrigin: "52px 10px" }, { x: 0, y: 0, rotation: 0, duration: 0.36, ease: "power3.out" }, 0.72);
      tl.to("#end-hand", { scale: 0.88, duration: 0.07, ease: "power2.in", yoyo: true, repeat: 1 }, 1.08);
      tl.fromTo("#end-ripple", { opacity: 0.7, scale: 0.4 }, { opacity: 0, scale: 1.25, duration: 0.5, ease: "power2.out", immediateRender: false }, 1.12);
      tl.fromTo(".ray", { opacity: 1, scale: 0.6, transformOrigin: "510px 640px" }, { opacity: 0, scale: 1.25, duration: 0.45, ease: "power2.out", immediateRender: false }, 1.14);
      tl.to("#end-follow", { opacity: 0, filter: "blur(8px)", duration: 0.12, ease: "power3.in" }, 1.12);
      tl.to("#end-field", { backgroundColor: "#EEF1F6", duration: 0.15, ease: "power2.inOut" }, 1.12);
      tl.fromTo("#end-done", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 1.2);
      tl.to("#end-hand", { x: 560, y: 900, rotation: 24, duration: 0.35, ease: "power3.in" }, 1.35);
      tl.set("#end-hand", { opacity: 0 }, 1.72);
      // «الجميل بتاعك»: the arrow draws down to the username, lands, and nudges twice
      tl.fromTo("#end-arrow-line", { strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 1.25);
      tl.fromTo("#end-arrow-head", { opacity: 0, scale: 0.6, transformOrigin: "250px 1545px" }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(1.8)" }, 1.7);
      tl.to("#end-arrow", { x: -16, y: 5, duration: 0.11, ease: "power2.out", yoyo: true, repeat: 3 }, 1.9);
      // «أنا يوسف»: the name slams in on its word over an orange marker; the arrow hands the accent over and turns ink
      tl.to(["#end-arrow-line", "#end-arrow-head"], { stroke: "#13213F", duration: 0.15, ease: "none" }, 2.1);
      pop("#end-ana", 2.12);
      tl.fromTo("#end-name", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 4 / 30, ease: "none" }, 2.24);
      tl.to("#end-hi", { scaleX: 1, duration: 0.3, ease: "power3.out" }, 2.3);
      tl.fromTo("#end-cam", { x: 12, y: -8 }, { x: 0, y: 0, duration: 0.3, ease: "elastic.out(1.2, 0.3)" }, 2.37);
      // «وبساعد الدكاترة يعملوا محتوى يبيع ويبني ثقة مع المريض»: word by word
      [2.72, 3.24, 3.78, 4.06, 4.54, 4.9, 5.38, 5.64, 5.8].forEach((t, i) => {
        tl.fromTo(`#end-sub .w:nth-of-type(${i + 1})`, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, t);
      });
      // stickers on «الدكاترة», «محتوى», «ثقة», then they float
      [["#end-s1", 3.24], ["#end-s2", 4.06], ["#end-s3", 5.38]].forEach(([sel, t], i) => {
        tl.fromTo(sel, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, t);
        tl.to(sel, { y: i % 2 ? 12 : -12, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: Math.floor((8.4 - t - 0.4) / 0.9) - 1 }, t + 0.4);
      });

      tl.to("#end-cam", { scale: 1.04, duration: 6.0, ease: "power1.inOut" }, 2.45);
