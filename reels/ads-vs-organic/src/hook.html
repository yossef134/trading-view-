<template>
  <style>
/*COMMON*/
    /* written on the cut clock (voice-cut.wav); the doctor in the middle is the viewer */
    #hook-cam { position: absolute; inset: 0; transform-origin: 540px 900px; }
    #root .say { position: absolute; padding: 16px 32px; border-radius: 40px; background: #ffffff; border: 4px solid var(--color-ink); font-size: 50px; line-height: 1.3; white-space: nowrap; direction: rtl; box-shadow: 0 14px 30px rgba(19, 33, 63, 0.14); }
    #root .say::after { content: ""; position: absolute; bottom: -16px; width: 26px; height: 26px; background: #ffffff; border-right: 4px solid var(--color-ink); border-bottom: 4px solid var(--color-ink); transform: rotate(45deg); }
    #root .say.tl::after { right: 46px; }
    #root .say.tr::after { left: 46px; }
    #root .hk-p, #root .hk-doc { position: absolute; width: 200px; height: 247px; margin: -247px 0 0 -100px; transform-origin: 50% 100%; }
    #hook-all { top: 250px; font-size: 120px; }
    #hook-l1 { top: 230px; font-size: 104px; line-height: 1.3; }
    #hook-l2 { top: 180px; font-size: 64px; }
    #hook-ad { position: absolute; left: 130px; top: 290px; width: 760px; height: 170px; border-radius: 40px; display: flex; align-items: center; justify-content: center; direction: rtl; font-size: 130px; color: var(--color-ink); background-color: rgba(255, 106, 19, 0); }
    #hook-burst { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    #root .mark { position: absolute; width: 96px; height: 96px; border-radius: 50%; background: #ffffff; border: 6px solid var(--color-ink); box-shadow: 0 12px 20px rgba(19, 33, 63, 0.18); text-align: center; font-size: 70px; line-height: 82px; }
    #hook-sweat { position: absolute; left: 618px; top: 820px; width: 34px; height: 48px; overflow: visible; }
    /* the thought: «يا ترى الكلام ده صح؟» */
    #hook-cloud { position: absolute; left: 230px; top: 470px; width: 640px; height: 300px; border-radius: 150px; background: #ffffff; border: 6px solid var(--color-ink); box-shadow: 0 16px 30px rgba(19, 33, 63, 0.14); direction: rtl; text-align: center; }
    #hook-ask { position: absolute; left: 0; right: 0; top: 34px; font-size: 58px; white-space: nowrap; }
    #hook-stamp { position: absolute; left: 0; right: 0; top: 112px; }
    #hook-stamp span { display: inline-block; font-size: 120px; line-height: 1.1; padding: 0 34px; border-radius: 24px; background: var(--color-accent); color: var(--color-ink); }
    #root .puff { position: absolute; border-radius: 50%; background: #ffffff; border: 6px solid var(--color-ink); }
    #root .q { position: absolute; font-size: 80px; color: var(--color-ink); }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="hook-cam" data-layout-allow-overlap>
      <!-- «كلهم بيقولولك»: everyone around the doctor, all talking at once -->
      <div class="hk-p" id="hook-p1" style="left: 110px; top: 760px"></div>
      <div class="hk-p" id="hook-p2" style="left: 975px; top: 790px"></div>
      <div class="hk-p" id="hook-p3" style="left: 120px; top: 1300px"></div>
      <div class="hk-p" id="hook-p4" style="left: 960px; top: 1310px"></div>
      <div class="hk-doc" id="hook-doc-w" style="left: 540px; top: 1180px"></div>
      <div class="hk-doc" id="hook-doc-o" style="left: 540px; top: 1180px"></div>
      <div class="hk-doc" id="hook-doc-t" style="left: 540px; top: 1180px"></div>
      <svg id="hook-sweat" viewBox="0 0 34 48" data-layout-ignore><path d="M17 3 C10 16 4 24 4 32 A13 13 0 0 0 30 32 C30 24 24 16 17 3 Z" fill="#FFFFFF" stroke="#13213F" stroke-width="4" /></svg>
      <div class="mark" id="hook-bang" style="left: 680px; top: 700px" data-layout-ignore>!</div>

      <div class="say tr hook-say" id="hook-s1" style="left: 160px; top: 470px">اعمل إعلان!</div>
      <div class="say tl hook-say" id="hook-s2" style="left: 560px; top: 520px">إعلان ممول وخلاص</div>
      <div class="say tr hook-say" id="hook-s3" style="left: 120px; top: 650px">الإعلان هو الحل</div>
      <div class="say tl hook-say" id="hook-s5" style="left: 650px; top: 690px">بوّست البوست</div>
      <div class="say tr hook-say" id="hook-s4" style="left: 90px; top: 1000px">زوّد الميزانية</div>
      <div class="say tl hook-say" id="hook-s6" style="left: 640px; top: 1050px">عروض وخصومات!</div>

      <div id="hook-all" class="t">كلهم بيقولولك:</div>
      <div id="hook-l1" class="t"><span class="w">مش</span> <span class="w">هتعرف</span> <span class="w">تسوّق</span><br /><span class="w">لعيادتك</span> <span class="w">صح</span></div>
      <div id="hook-l2" class="t"><span class="w">غير</span> <span class="w">لما</span> <span class="w">تعمل</span></div>
      <svg id="hook-burst" viewBox="0 0 1080 1920" data-layout-ignore><circle id="hook-ring" cx="510" cy="375" r="300" fill="none" stroke="#FF6A13" stroke-width="14" /></svg>
      <div id="hook-ad"><span>إعلان ممول</span></div>

      <div class="puff" id="hook-c1" style="left: 640px; top: 800px; width: 30px; height: 30px" data-layout-ignore></div>
      <div class="puff" id="hook-c2" style="left: 672px; top: 752px; width: 46px; height: 46px" data-layout-ignore></div>
      <div id="hook-cloud" data-layout-ignore>
        <div id="hook-ask"><span class="w">يا ترى</span> <span class="w">الكلام</span> <span class="w">ده</span></div>
        <div id="hook-stamp"><span>صح؟</span></div>
      </div>
      <div class="q" id="hook-q1" style="left: 300px; top: 830px">؟</div>
      <div class="q" id="hook-q2" style="left: 740px; top: 860px">؟</div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
/*PEOPLE*/
      [["#hook-p1", 3], ["#hook-p2", 0], ["#hook-p3", 5], ["#hook-p4", 4]].forEach(([sel, i]) => {
        document.querySelector(sel).innerHTML = person(PEOPLE[i], "hk" + i);
      });
      document.getElementById("hook-doc-w").innerHTML = person({ ...DOCTOR, mood: "worried" }, "hkw");
      document.getElementById("hook-doc-o").innerHTML = person({ ...DOCTOR, mood: "wow" }, "hko");
      document.getElementById("hook-doc-t").innerHTML = person({ ...DOCTOR, think: true, look: [3, -4] }, "hkt");
      // speed lines out of «إعلان ممول»
      const burst = document.getElementById("hook-burst");
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2 + 0.13, cx = 510, cy = 375;
        burst.insertAdjacentHTML("beforeend", `<path class="hk-ray" d="M ${(cx + Math.cos(a) * 420).toFixed(1)} ${(cy + Math.sin(a) * 200).toFixed(1)} L ${(cx + Math.cos(a) * 540).toFixed(1)} ${(cy + Math.sin(a) * 270).toFixed(1)}" stroke="#13213F" stroke-width="10" stroke-linecap="round" />`);
      }
      const kick = (t, k) => tl.fromTo("#hook-cam", { x: 12 * k, y: 10 * k }, { x: 0, y: 0, duration: 0.24, ease: "elastic.out(1.2, 0.35)" }, t);

      // frame 0 (the thumbnail): «كلهم بيقولولك:», the doctor, four people and three voices already talking
      gsap.set(["#hook-l1 .w", "#hook-l2 .w", "#hook-ad", "#hook-doc-o", "#hook-doc-t", "#hook-sweat", "#hook-bang", "#hook-cloud", ".puff", ".q", "#hook-ring", ".hk-ray", "#hook-s3", "#hook-s5", "#hook-s6"], { opacity: 0 });
      gsap.set(".hk-p", { scale: 1.05 });
      gsap.set(".hk-doc", { scale: 2 });
      gsap.set(["#hook-p1", "#hook-p3"], { rotation: 7 });
      gsap.set(["#hook-p2", "#hook-p4"], { rotation: -7 });
      gsap.set(["#hook-s1", "#hook-s2", "#hook-s4"], { rotation: (i) => [-6, 5, 4][i] });

      // the room closes in on him while they shout
      tl.fromTo("#hook-cam", { scale: 1 }, { scale: 1.06, duration: 1.1, ease: "power1.in" }, 0);
      [["#hook-s3", 0.1, 3], ["#hook-s5", 0.22, -4], ["#hook-s6", 0.34, -2]].forEach(([sel, t, rot]) => {
        tl.fromTo(sel, { opacity: 0, scale: 0.5, rotation: 0 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.2, ease: "back.out(2)" }, t);
      });
      document.querySelectorAll(".hook-say").forEach((el, i) => {
        tl.to(el, { y: i % 2 ? -7 : 7, duration: 0.09, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0.12 + i * 0.03);
      });
      document.querySelectorAll(".hk-p").forEach((el, i) => {
        tl.to(el, { y: -14, duration: 0.14, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.05 + i * 0.05);
      });

      // «مش هتعرف تسوّق لعيادتك صح»: the noise falls back, the line slams in word by word, he sweats
      tl.to("#hook-all", { opacity: 0, y: -60, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 1.0);
      tl.to(["#hook-cam"], { scale: 1, duration: 0.3, ease: "power3.out" }, 1.1);
      tl.to([".hook-say", ".hk-p"], { opacity: 0.22, scale: "-=0.1", filter: "blur(3px)", duration: 0.3, ease: "power2.out" }, 1.1);
      [1.11, 1.39, 1.75, 2.23, 2.73].forEach((t, i) => {
        tl.fromTo(`#hook-l1 .w:nth-of-type(${i + 1})`, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 4 / 30, ease: "none" }, t);
        kick(t + 0.13, i % 2 ? -1 : 1);
      });
      tl.fromTo("#hook-sweat", { opacity: 0, scale: 0.3, y: -10 }, { opacity: 1, scale: 1, y: 0, duration: 0.25, ease: "back.out(2)" }, 1.5);
      tl.to("#hook-sweat", { y: 40, duration: 1.2, ease: "power1.in" }, 1.75);
      // the voices are blown out of frame
      // each voice leaves by its own side: s1, s3, s4 sit left, s2, s5, s6 sit right
      [[-1100, -80], [1100, -60], [-1100, 40], [-1100, 30], [1100, 80], [1100, 100]].forEach(([dx, dy], i) => {
        tl.to(`#hook-s${i + 1}`, { x: dx, y: dy, duration: 0.35, ease: "power3.in" }, 3.0 + i * 0.03);
        tl.set(`#hook-s${i + 1}`, { opacity: 0 }, 3.4 + i * 0.03);
      });
      [["#hook-p1", -700], ["#hook-p2", 700], ["#hook-p3", -700], ["#hook-p4", 700]].forEach(([sel, dx], i) => {
        tl.to(sel, { x: dx, duration: 0.35, ease: "power3.in" }, 3.02 + i * 0.03);
      });
      tl.to("#hook-l1", { opacity: 0, y: -50, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 2.98);
      tl.to("#hook-sweat", { opacity: 0, duration: 0.15, ease: "none" }, 3.0);

      // «غير لما تعمل إعلان ممول»: three words, then the hit: a ring and speed lines, the block slams on orange, he gasps
      [3.01, 3.4, 3.6].forEach((t, i) => {
        tl.fromTo(`#hook-l2 .w:nth-of-type(${i + 1})`, { opacity: 0, y: 40, scale: 1.25 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, t);
      });
      tl.set("#hook-ad", { opacity: 1 }, 4.03);
      tl.fromTo("#hook-ad", { scale: 1.7, backgroundColor: "rgba(255,106,19,1)" }, { scale: 1, duration: 4 / 30, ease: "none" }, 4.03);
      tl.fromTo("#hook-ring", { opacity: 1, scale: 0.4, transformOrigin: "510px 375px" }, { opacity: 0, scale: 1.6, duration: 0.5, ease: "power2.out", immediateRender: false }, 4.1);
      tl.fromTo(".hk-ray", { opacity: 1, scale: 0.7, transformOrigin: "510px 375px" }, { opacity: 0, scale: 1.3, duration: 0.4, ease: "power2.out", immediateRender: false }, 4.1);
      kick(4.16, 1.6);
      tl.set("#hook-doc-w", { opacity: 0 }, 4.06);
      tl.set("#hook-doc-o", { opacity: 1 }, 4.06);
      tl.fromTo("#hook-doc-o", { scale: 2.12 }, { scale: 2, duration: 0.25, ease: "back.out(3)" }, 4.06);
      tl.fromTo("#hook-bang", { opacity: 0, scale: 0.3, rotation: -20 }, { opacity: 1, scale: 1, rotation: 8, duration: 0.3, ease: "back.out(2.5)" }, 4.12);
      tl.fromTo("#hook-ad", { scale: 1 }, { scale: 1.06, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 4.43);

      // «يا ترى الكلام ده صح؟»: the block cools, the doctor thinks, the question forms in a cloud
      tl.to(["#hook-l2", "#hook-bang"], { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 4.95);
      tl.to("#hook-ad", { backgroundColor: "rgba(238,241,246,1)", duration: 0.3, ease: "power2.inOut" }, 5.0);
      tl.set("#hook-doc-o", { opacity: 0 }, 5.12);
      tl.set("#hook-doc-t", { opacity: 1 }, 5.12);
      tl.fromTo("#hook-doc-t", { scale: 1.9 }, { scale: 2, duration: 0.3, ease: "back.out(2.5)" }, 5.12);
      [["#hook-c1", 5.14], ["#hook-c2", 5.2]].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, t);
      });
      tl.fromTo("#hook-cloud", { opacity: 0, scale: 0.3, transformOrigin: "75% 100%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 5.24);
      [5.3, 5.46, 5.76].forEach((t, i) => {
        tl.fromTo(`#hook-ask .w:nth-of-type(${i + 1})`, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, t);
      });
      [["#hook-q1", 5.3, -14], ["#hook-q2", 5.5, 12]].forEach(([sel, t, rot]) => {
        tl.fromTo(sel, { opacity: 0, y: 30, rotation: 0 }, { opacity: 1, y: -50, rotation: rot, duration: 0.6, ease: "power2.out" }, t);
      });
      tl.fromTo("#hook-stamp", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 4 / 30, ease: "none" }, 5.9);
      kick(6.03, -1);

      // hand-off: «إعلان ممول» shrinks into the ad's badge (centre 557.3,428.6 at 0.215)
      tl.to(["#hook-cloud", ".puff", ".q", "#hook-doc-t"], { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power3.in" }, 6.1);
      tl.to("#hook-ad", { x: 47.3, y: 53.6, scale: 0.215, duration: 0.27, ease: "power3.inOut" }, 6.09);
      tl.to("#hook-ad span", { color: "#5A6378", duration: 0.27, ease: "power3.inOut" }, 6.09);

      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
