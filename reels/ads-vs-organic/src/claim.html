<template>
  <style>
/*COMMON*/
    #claim-flood { position: absolute; inset: 0; background-color: var(--color-accent); }
    /* the foundation scene's last frame, so the flood grows over it rather than over an empty page */
    #claim-under .brick { position: absolute; left: 130px; width: 760px; height: 96px; border-radius: 18px; background: var(--color-ink); color: #ffffff; direction: rtl; text-align: center; font-size: 48px; line-height: 96px; }
    #claim-cam { position: absolute; inset: 0; }
    /* «واستمراريتك»: a week of posts, ticked off day by day */
    #root .day { position: absolute; top: 600px; width: 112px; height: 140px; margin-left: -56px; border-radius: 22px; background: #ffffff; box-shadow: 0 14px 22px rgba(19, 33, 63, 0.18); text-align: center; font-size: 40px; line-height: 56px; }
    #root .day svg { position: absolute; left: 26px; top: 64px; width: 60px; height: 52px; overflow: visible; }
    #claim-top { position: absolute; inset: 0; transform-origin: 540px 250px; }
    /* «مليون»: an odometer that rolls up to a million */
    #claim-num { position: absolute; left: 60px; top: 610px; width: 960px; height: 180px; direction: ltr; text-align: center; white-space: nowrap; font-size: 150px; line-height: 180px; font-variant-numeric: tabular-nums; }
    #root .col { display: inline-block; height: 180px; overflow: hidden; vertical-align: top; }
    #root .col div { height: 180px; }
    #claim-scrib { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    /* «من أي إعلان ممول»: a balance; the content side stays down whatever lands on the ad side */
    #claim-bal { position: absolute; inset: 0; }
    #claim-beam { position: absolute; left: 190px; top: 810px; width: 700px; height: 20px; border-radius: 10px; background: var(--color-ink); transform-origin: 350px 10px; }
    #root .pan { position: absolute; top: 10px; width: 0; height: 0; transform-origin: 0 0; }
    #root .pan svg.rig { position: absolute; left: -150px; top: 0; width: 300px; height: 190px; overflow: visible; }
    #root .tile { position: absolute; width: 86px; height: 104px; border-radius: 16px; background: #ffffff; box-shadow: 0 8px 14px rgba(19, 33, 63, 0.16); }
    #root .tile svg { position: absolute; left: 20px; top: 30px; width: 46px; height: 40px; overflow: visible; }
    #root .badge { position: absolute; left: -125px; top: 74px; width: 250px; height: 76px; border-radius: 22px; background: var(--color-surface); color: var(--color-ad-ink); font-size: 42px; line-height: 76px; text-align: center; direction: rtl; white-space: nowrap; }
    #root .cash { position: absolute; left: -90px; width: 180px; height: 70px; border-radius: 10px; background: #b9c8b0; border: 4px solid var(--color-ink); }
    #root .cash::after { content: ""; position: absolute; left: 66px; top: 9px; width: 40px; height: 44px; border: 4px solid var(--color-ink); border-radius: 50%; }
  </style>
  <div id="root" data-composition-id="claim" data-width="1080" data-height="1920">
    <div id="claim-under" data-layout-ignore>
      <div class="t" style="top: 250px; font-size: 150px; line-height: 1.2">الأساس</div>
      <div class="t" style="top: 470px; font-size: 68px"><span class="w">المحتوى</span> <span class="w">وبناء</span> <span class="w">الثقة</span></div>
      <div class="brick" style="top: 1034px">نصايح</div>
      <div class="brick" style="top: 926px">محتوى قيّم</div>
      <div class="brick" style="top: 818px">معلومات</div>
      <div class="brick" style="top: 710px">تجربة</div>
      <div class="brick" style="top: 602px; background: #FF6A13; color: #13213F">سؤال وجواب</div>
    </div>
    <div id="claim-flood" class="paper-on-orange" data-layout-ignore></div>
    <div id="claim-cam" data-layout-allow-overlap>
      <div id="claim-intro">
        <div class="t" id="claim-a" style="top: 250px; font-size: 120px; line-height: 1.2">واستمراريتك</div>
        <div class="t" id="claim-a2" style="top: 430px; font-size: 70px"><span class="w">بقى</span> <span class="w">في</span> <span class="w">المحتوى</span> <span class="w">ده</span></div>
        <div id="claim-week"></div>
      </div>
      <div id="claim-top">
        <div class="t" id="claim-big" style="top: 290px; font-size: 250px; line-height: 1.2">أهم</div>
        <div id="claim-num"></div>
        <svg id="claim-scrib" viewBox="0 0 1080 1920" data-layout-ignore><path d="M 290 700 C 380 600, 780 590, 860 670 C 930 760, 780 830, 540 835 C 320 840, 190 790, 220 715 C 240 665, 320 640, 420 628" pathLength="100" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-dasharray="100 120" stroke-dashoffset="100" /></svg>
        <div class="t" id="claim-mara" style="top: 820px; font-size: 150px; line-height: 1.2">مرة</div>
      </div>
      <div id="claim-bal">
        <svg viewBox="0 0 1080 1920" style="position: absolute; left: 0; top: 0; width: 1080px; height: 1920px" data-layout-ignore><polygon points="540,820 460,1100 620,1100" fill="#13213F" /><rect x="400" y="1096" width="280" height="26" rx="13" fill="#13213F" /></svg>
        <div id="claim-beam">
          <div class="pan" id="claim-panL" style="left: 0">
            <svg class="rig" viewBox="-150 0 300 190"><path d="M0 0 L-120 150 M0 0 L120 150" stroke="#13213F" stroke-width="5" /><path d="M -140 150 Q 0 215 140 150 Z" fill="#13213F" /></svg>
            <div class="badge" id="claim-ad">إعلان ممول</div>
          </div>
          <div class="pan" id="claim-panR" style="left: 700px">
            <svg class="rig" viewBox="-150 0 300 190"><path d="M0 0 L-120 150 M0 0 L120 150" stroke="#13213F" stroke-width="5" /><path d="M -140 150 Q 0 215 140 150 Z" fill="#13213F" /></svg>
          </div>
        </div>
        <div id="claim-pivot" style="position: absolute; left: 524px; top: 804px; width: 32px; height: 32px; border-radius: 50%; background: #ffffff; border: 8px solid #13213F"></div>
      </div>
      <div class="t" id="claim-c" style="top: 1220px; font-size: 60px"><span class="w">حتى</span> <span class="w">لو</span> <span class="w">هتصرف</span> <span class="w">فيه</span> <span class="w">فلوس</span> <span class="w">كتير</span></div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const AR = "٠١٢٣٤٥٦٧٨٩", EN = "0123456789";
      const CHECK = '<svg viewBox="0 0 46 40"><path d="M4 21 L17 34 L42 6" fill="none" stroke="#13213F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100" /></svg>';
      // seven days, right to left
      const week = document.getElementById("claim-week");
      for (let i = 0; i < 7; i++) {
        const d = document.createElement("div");
        d.className = "day";
        d.style.left = 905 - i * 132 + "px";
        d.innerHTML = "يوم " + AR[i + 1] + CHECK;
        week.appendChild(d);
      }
      // the odometer: 1 then six zeros, with Arabic thousands marks; each wheel spins through whole turns
      const num = document.getElementById("claim-num");
      const wheels = [];
      "1000000".split("").forEach((dg, i) => {
        if (i === 1 || i === 4) num.insertAdjacentHTML("beforeend", '<span class="col">,</span>');
        const stop = 20 + +dg; // two whole turns, then the digit
        const col = document.createElement("span");
        col.className = "col";
        col.innerHTML = "<div>" + Array.from({ length: stop + 1 }, (_, k) => '<div>' + EN[k % 10] + "</div>").join("") + "</div>";
        num.appendChild(col);
        wheels.push([col.firstChild, stop]);
      });
      // the pans: three tiles and one on top on the right; bills stack on the ad on the left
      const panR = document.getElementById("claim-panR");
      [[-130, 46], [-40, 46], [50, 46], [-85, -62], [5, -62]].forEach(([x, y]) => {
        panR.insertAdjacentHTML("beforeend", `<div class="tile" style="left: ${x}px; top: ${y}px">${CHECK.replace('stroke-dashoffset="100"', 'stroke-dashoffset="0"')}</div>`);
      });
      const panL = document.getElementById("claim-panL");
      for (let i = 0; i < 5; i++) panL.insertAdjacentHTML("beforeend", `<div class="cash" style="top: ${2 - i * 44}px; transform: rotate(${[4, -6, 3, -4, 7][i]}deg)"></div>`);
      const tiles = [...panR.querySelectorAll(".tile")], cash = [...panL.querySelectorAll(".cash")];

      const shake = (t, k) => tl.fromTo("#claim-cam", { x: 14 * k, y: -8 * k }, { x: 0, y: 0, duration: 0.3, ease: "elastic.out(1.2, 0.3)" }, t);
      // the beam and both pans turn together, so the pans always hang level
      const tilt = (deg, t, d, ease) => {
        tl.to("#claim-beam", { rotation: deg, duration: d, ease }, t);
        tl.to(".pan", { rotation: -deg, duration: d, ease }, t);
      };
      const wordsIn = (sel, times) => times.forEach((t, i) => {
        tl.fromTo(`${sel} .w:nth-of-type(${i + 1})`, { opacity: 0, y: 40, scale: 1.25 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, t);
      });

      gsap.set(["#claim-a", "#claim-a2 .w", ".day", "#claim-big", "#claim-num", "#claim-mara", "#claim-c .w"], { opacity: 0 });
      gsap.set("#claim-bal", { y: 1300 });
      gsap.set([...tiles, "#claim-ad", ...cash], { opacity: 0 });

      // orange flood out of the top brick
      tl.fromTo("#claim-flood", { clipPath: "circle(48px at 510px 650px)" }, { clipPath: "circle(2300px at 510px 650px)", duration: 0.5, ease: "power2.inOut" }, 0);
      tl.set("#claim-under", { opacity: 0 }, 0.5);

      // «واستمراريتك بقى في المحتوى ده»: the week fills in, one tick a day
      tl.fromTo("#claim-a", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.1);
      wordsIn("#claim-a2", [1.2, 1.42, 1.52, 2.04]);
      document.querySelectorAll(".day").forEach((d, i) => {
        tl.fromTo(d, { opacity: 0, x: 140, rotation: 12 }, { opacity: 1, x: 0, rotation: 0, duration: 0.35, ease: "back.out(1.8)" }, 0.35 + i * 0.24);
        tl.to(d.querySelector("path"), { strokeDashoffset: 0, duration: 0.16, ease: "power2.out" }, 0.5 + i * 0.24);
      });
      tl.to("#claim-week", { x: -36, duration: 2.0, ease: "none" }, 0.4);
      tl.to(["#claim-a", "#claim-a2", "#claim-week"], { y: -520, opacity: 0, duration: 0.24, ease: "power3.in", stagger: 0.03 }, 2.24);

      // «أهم»: slam
      tl.fromTo("#claim-big", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 4 / 30, ease: "none" }, 2.46);
      shake(2.59, 1);
      // «مليون»: the wheels spin and stop right to left; the leading 1 lands on «مرة»
      tl.set("#claim-num", { opacity: 1 }, 2.74);
      wheels.forEach(([strip, stop], i) => {
        tl.fromTo(strip, { y: 0 }, { y: -180 * stop, duration: 0.25 + (6 - i) * 0.04, ease: "power3.out" }, 2.78);
      });
      tl.to("#claim-scrib path", { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 3.0);
      tl.fromTo("#claim-mara", { opacity: 0, y: 50, scale: 1.3 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, 3.28);

      // «من أي إعلان ممول»: the claim steps up, the balance rises; content lands heavy
      tl.to("#claim-top", { scale: 0.52, y: -60, duration: 0.45, ease: "power3.inOut" }, 3.56);
      tl.to("#claim-bal", { y: 0, duration: 0.45, ease: "power3.out" }, 3.6);
      tiles.forEach((el, i) => {
        tl.set(el, { opacity: 1 }, 3.78 + i * 0.06);
        tl.fromTo(el, { y: -700 }, { y: 0, duration: 0.3, ease: "power2.in" }, 3.78 + i * 0.06);
      });
      tilt(14, 4.1, 0.2, "power2.out");
      tl.set("#claim-ad", { opacity: 1 }, 4.0);
      tl.fromTo("#claim-ad", { y: -700 }, { y: 0, duration: 0.28, ease: "power2.in" }, 4.0);
      tilt(11, 4.3, 0.1, "power2.out");
      tilt(14, 4.4, 0.55, "elastic.out(1, 0.4)");

      // «حتى لو هتصرف فيه فلوس كتير»: bill after bill on the ad side; it barely moves
      wordsIn("#claim-c", [5.04, 5.66, 5.86, 6.38, 6.72, 7.04]);
      [5.66, 5.98, 6.3, 6.6, 6.9].forEach((t, i) => {
        tl.set(cash[i], { opacity: 1 }, t);
        tl.fromTo(cash[i], { y: -760 }, { y: 0, duration: 0.26, ease: "power2.in" }, t);
        tilt(12.5, t + 0.26, 0.08, "power2.out");
        tilt(14, t + 0.34, 0.22, "elastic.out(1, 0.4)");
      });

      // clear the type before the end card takes the orange field
      tl.to("#claim-cam", { opacity: 0, filter: "blur(10px)", y: -40, duration: 0.22, ease: "power3.in" }, 7.3);
      window.__timelines["claim"] = tl;
    })();
  </script>
</template>
