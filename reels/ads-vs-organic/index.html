        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* graph paper (from the references): 60 px cells, a dot every 240 px at x 60+240k, y 120+240k */
      #ground {
        position: absolute;
        inset: 0;
        background-color: var(--color-ground);
        background-image:
          radial-gradient(circle, rgba(19, 33, 63, 0.2) 3px, transparent 3.5px),

          linear-gradient(90deg, rgba(19, 33, 63, 0.07) 1.5px, transparent 1.5px);

        background-position: -60px 0, 0 0, 0 0;
      }
