<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحليل حساب انستجرام</title>
<style>

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {

    --plane: #0d0d0d; --surface: #1a1a19;
    --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --neutral: #4b4a46;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --accent: #3987e5; --good-text: #0ca30c; --wash: rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19;
  --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --neutral: #4b4a46;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --accent: #3987e5; --good-text: #0ca30c; --wash: rgba(255,255,255,.05);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.card + .grid, .card + .card { margin-top: 12px; }
html { background: var(--plane); }
body { margin: 0; background: var(--plane); color: var(--ink);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 26px; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 19px; margin: 40px 0 4px; font-weight: 650; }

.top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
.btn:hover { background: var(--wash); }
.btn[aria-pressed="true"] { border-color: var(--accent); }

.ico.good { background: var(--good); } .ico.crit { background: var(--crit); }

.idx { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kv { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 14px; }
.kv:last-child { border-bottom: 0; }
.quote { background: var(--wash); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; margin: 8px 0; }
.callout { border: 1px solid var(--border); background: var(--wash); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--ink2); margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tip { position: fixed; z-index: 50; pointer-events: none; max-width: 300px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
.tip[hidden] { display: none; }
.tip .tv { font-weight: 700; font-size: 15px; }
.tip .ts { color: var(--ink2); }
.empty { color: var(--muted); padding: 16px 0; font-size: 14px; }
.foot { margin-top: 48px; color: var(--muted); font-size: 12.5px; }
.idea { padding: 10px 0; border-bottom: 1px solid var(--grid); }
.idea:last-child { border-bottom: 0; }
@media (max-width: 560px) { h1 { font-size: 22px; } .hbar { grid-template-columns: 1fr auto; } .hbar .track { grid-column: 1 / -1; order: 3; } }
@media print { .btn { display: none; } body { background: #fff; } }

    h("div", { class: "callout" }, "نتايج الهاشتاج بتخلط حسابات بأحجام مختلفة، فالمشاهدات المطلقة بتميل لصالح الحسابات الكبيرة. استخدمها لتعلّم الهوكات والمدة والفورمات، مش كهدف رقمي."),
    N.top_hashtags.length ? h("div", { class: "chips", style: "margin-top:10px" }, N.top_hashtags.map((t) => h("span", { class: "badge" }, ltr("#" + t.tag + " · " + t.n)))) : null,
    IN.notes ? h("p", { style: "margin-top:10px" }, IN.notes) : null));
}

/* competitors */
if (C && C.profiles && C.profiles.length) {
  app.append(...section("competitors", "المنافسين"));
  const rows = [[ handle(A.profile.username) + " (حسابك)", full(A.profile.followers), full(A.profile.following), A.bio.bio_text ]].concat(
    C.profiles.map((p) => [ handle(p.username), full(p.followers), full(p.following), p.biography ]));
  app.append(h("div", { class: "card" }, table([{ t: "الحساب" }, { t: "متابعين", num: true }, { t: "بيتابع", num: true }, { t: "البايو", cls: "hook" }], rows),
    I.competitors_notes ? h("p", { style: "margin-top:10px" }, I.competitors_notes) : null));
}

/* plan */
const PL = I.plan;
if (PL) {
  app.append(...section("plan", "خطة 30 يوم"));
  const cards = [];
  if (PL.cadence || (PL.posting_slots && PL.posting_slots.length)) cards.push(h("div", { class: "card" }, h("h3", {}, "الإيقاع"), PL.cadence ? h("p", {}, PL.cadence) : null, PL.posting_slots ? h("ul", {}, PL.posting_slots.map((x) => h("li", {}, x))) : null));
  if (PL.pillars && PL.pillars.length) cards.push(h("div", { class: "card" }, h("h3", {}, "ركائز المحتوى"), PL.pillars.map((p) => h("div", { class: "idea" }, h("b", {}, p.name), p.format ? " · " + p.format : "", p.hook_style ? h("div", { class: "sub", style: "margin:0" }, "نمط الهوك: " + p.hook_style) : null, p.why ? h("div", { class: "sub", style: "margin:0" }, p.why) : null))));
  if (PL.experiments && PL.experiments.length) cards.push(h("div", { class: "card" }, h("h3", {}, "تجارب الأسابيع"), PL.experiments.map((e) => h("div", { class: "idea" }, h("b", {}, e.week ? "أسبوع " + e.week + ": " : ""), e.test, e.metric ? h("div", { class: "sub", style: "margin:0" }, "المقياس: " + e.metric) : null))));
  app.append(h("div", { class: "grid g-3" }, cards));
  if (PL.ideas && PL.ideas.length) app.append(h("div", { class: "card", style: "margin-top:12px" }, h("h3", {}, "أفكار فيديوهات جاهزة"),
    PL.ideas.map((x, i) => h("div", { class: "idea" }, h("b", {}, (i + 1) + ". " + x.hook), h("div", { class: "sub", style: "margin:0" }, [x.format, x.why].filter(Boolean).join(" · "), x.based_on ? [" · مبنية على: ", safeUrl(x.based_on) ? link(x.based_on, "ريل مرجعي ↗") : x.based_on] : null)))));
}
if (I.extras && I.extras.length) { app.append(...section("extras", "ملاحظات تانية")); app.append(h("div", { class: "card" }, h("ul", {}, I.extras.map((l) => h("li", {}, l))))); }

/* all posts */
app.append(...section("all", "كل البوستات", "اضغط على عنوان العمود للترتيب."));
app.append(h("div", { class: "card" }, table([{ t: "التاريخ" }, { t: "الفورمات" }, { t: "الهوك", cls: "hook" }, { t: "مشاهدات", num: true }, { t: "لايك", num: true }, { t: "كومنت", num: true }, { t: "المؤشر", num: true }, { t: "الحكم" }, { t: "" }],
  P.slice().reverse().map((p) => [day(p.timestamp), FMT[p.format] || p.format, p.hook, { sort: p.views == null ? -1 : p.views, text: full(p.views) }, { sort: p.likes == null ? -1 : p.likes, text: full(p.likes) }, { sort: p.comments == null ? -1 : p.comments, text: full(p.comments) }, { sort: p.index == null ? -1 : p.index, text: p.index == null ? (p.is_pinned ? "مثبت" : "جديد") : x2(p.index) }, p.verdict ? { win: "ناجح", lose: "فاشل", normal: "عادي" }[p.verdict] : "—", { el: link(p.url, "↗") }]), true)));

app.append(h("div", { class: "foot" }, `مصدر البيانات: Apify (بيانات عامة فقط) · ${I.cost_note || "تكلفة السحب ≈ $" + A.meta.apify_cost_usd} · الوسيط بدل المتوسط عشان بوست فايرال واحد ما يخبيش الباقي. الريتش والسيفز والشيرز مش متاحة علنًا؛ لو الحساب بتاعك اربطه بـSupermetrics. نطاقات التفاعل المرجعية تقريبية مش أرقام رسمية.`));
})();
</script>
</body>
