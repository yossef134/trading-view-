  }
  app.append(grid);
  app.append(h("div", { class: "callout" }, "ده استنتاج من أداء بوستات قديمة، مش بيانات نشاط الجمهور الحقيقية. لو الحساب بتاعك اربطه بـSupermetrics عشان تعرف الساعات الفعلية لمتابعينك." + (I.timing_note ? " — " + I.timing_note : "")));
}

/* patterns */
app.append(...section("patterns", "أنماط المحتوى", "كل مقارنة بين مجموعتين أو أكتر بوسيط المؤشر. الأزرق = الأقوى (لو العينة 3 بوستات أو أكتر)، الباهت = عينة صغيرة."));
{
  const fmtRows = Object.entries(A.patterns.format);

  const seg = h("div", { class: "seg", role: "img", "aria-label": "توزيع الفورمات" }, fmtRows.map(([f, v]) => {
    const d = h("div", { class: f === "video" ? "dk" : "", style: `flex:${v.n};background:${FCOL[f] || "var(--neutral)"}` }, v.share_pct >= 14 ? `${FMT[f] || f} ${ltr(Math.round(v.share_pct) + "%")}` : "");
    return d;
  }));
  app.append(h("div", { class: "card" }, h("h3", {}, "توزيع الفورمات"), legend(fmtRows.map(([f]) => f)), seg,
    table([{ t: "الفورمات" }, { t: "عدد", num: true }, { t: "لايك (وسيط)", num: true }, { t: "كومنت (وسيط)", num: true }, { t: "مشاهدات (وسيط)", num: true }, { t: "تفاعل/متابع", num: true }],
      fmtRows.map(([f, v]) => [FMT[f] || f, v.n, full(v.median_likes), full(v.median_comments), full(v.median_views), pct(v.median_er, 3)]))));
  const cards = [];
  for (const [key, [title, names]] of Object.entries(PAT)) {
    const g = A.patterns[key]; if (!g) continue;
    const items = Object.entries(g).map(([k, v]) => ({ name: names[k] || k, value: v.median_index, n: v.n }));
    if (items.length < 2) continue;
    cards.push(h("div", { class: "card" }, h("h3", {}, title), h("div", { class: "sub", style: "margin:0 0 6px" }, "الخط الرفيع = المعتاد (×1)"), hbars(items, 1)));
  }
  app.append(h("div", { class: "grid g-2", style: "margin-top:12px" }, cards.length ? cards : h("div", { class: "empty" }, "العينة صغيرة على المقارنات.")));
  if (A.patterns.top_hashtags.length) app.append(h("div", { class: "card", style: "margin-top:12px" }, h("h3", {}, "أكتر هاشتاجات مستخدمة"),
    h("div", { class: "chips", style: "margin-top:8px" }, A.patterns.top_hashtags.map((t) => h("span", { class: "badge" }, ltr("#" + t.tag + " · " + t.n))))));
  if (I.patterns_notes && I.patterns_notes.length) app.append(h("div", { class: "card", style: "margin-top:12px" }, h("h3", {}, "قراءة الأنماط"), h("ul", {}, I.patterns_notes.map((l) => h("li", {}, l)))));
}

/* bio */
app.append(...section("bio", "البايو واللينك"));

      chk(B.category_set, "الفئة (Category) محددة"), chk((B.highlights || 0) > 0, "فيه Highlights", `${B.highlights || 0}`),
      h("div", { class: "callout" }, "الفحوصات آلية. الحكم على الوضوح (مين؟ إيه الفايدة؟ ليه أصدقك؟ أعمل إيه بعدين؟) بيتكتب في التقرير.")),
    h("div", { class: "card" }, h("h3", {}, "التقييم والاقتراح"),

      IB.rewrite ? [h("div", { class: "sub", style: "margin:8px 0 0" }, "بايو مقترح:"), h("div", { class: "quote" }, IB.rewrite)] : null,

    N.top_hashtags.length ? h("div", { class: "chips", style: "margin-top:10px" }, N.top_hashtags.map((t) => h("span", { class: "badge" }, ltr("#" + t.tag + " · " + t.n)))) : null,

}
if (I.extras && I.extras.length) { app.append(...section("extras", "ملاحظات تانية")); app.append(h("div", { class: "card" }, h("ul", {}, I.extras.map((l) => h("li", {}, l))))); }

  P.slice().reverse().map((p) => [day(p.timestamp), FMT[p.format] || p.format, p.hook, { sort: p.views == null ? -1 : p.views, text: full(p.views) }, { sort: p.likes == null ? -1 : p.likes, text: full(p.likes) }, { sort: p.comments == null ? -1 : p.comments, text: full(p.comments) }, { sort: p.index == null ? -1 : p.index, text: p.index == null ? (p.is_pinned ? "مثبت" : "جديد") : x2(p.index) }, p.verdict ? { win: "ناجح", lose: "فاشل", normal: "عادي" }[p.verdict] : "—", { el: link(p.url, "↗") }]), true)));

app.append(h("div", { class: "foot" }, `مصدر البيانات: Apify (بيانات عامة فقط) · ${I.cost_note || "تكلفة السحب ≈ $" + A.meta.apify_cost_usd} · الوسيط بدل المتوسط عشان بوست فايرال واحد ما يخبيش الباقي. الريتش والسيفز والشيرز مش متاحة علنًا؛ لو الحساب بتاعك اربطه بـSupermetrics. نطاقات التفاعل المرجعية تقريبية مش أرقام رسمية.`));
